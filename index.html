<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Music App Navbar</title>
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <!-- Logo Section -->
        <div class="nav-logo">
            <i class="bi bi-vinyl-fill logo-icon"></i>
            <span>Mus<span class="accent-text">Tube</span></span>
        </div>

        <!-- Desktop Navigation Links -->
        <ul class="nav-links" id="navLinks">
            <li><a href="#" class="active"><i class="bi bi-house-door"></i> Home</a></li>
            <li><a href="#"><i class="bi bi-compass"></i> Discover</a></li>
            <li><a href="#"><i class="bi bi-music-note-list"></i> Playlist</a></li>
            <li><a href="#"><i class="bi bi-heart"></i> Favorites</a></li>
        </ul>

        <!-- Right Side: Search & Profile -->
        <div class="nav-actions">
            <div class="search-box">
                <i class="bi bi-search search-icon"></i>
                <input type="text" placeholder="Search songs, artists...">
            </div>
            <div class="user-profile">
                <img src="https://unsplash.com" alt="Profile">
            </div>
            <!-- Hamburger Menu for Mobile -->
            <button class="menu-toggle" id="menuToggle">
                <i class="bi bi-list"></i>
            </button>
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
