<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro KhataBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Dashboard: Dukan ka Total Udhar -->
        <div class="dashboard">
            <p>jamshed kirana store Ka Total Udhar</p>
            <h1 id="totalShopBalance">₹0</h1>
        </div>

        <!-- Search Bar -->
        <div class="search-section">
            <input type="text" id="searchInput" onkeyup="searchCustomer()" placeholder="🔍 Grahak dhoondhein...">
        </div>

        <!-- Entry wala dabba -->
        <div class="card input-section">
            <input type="text" id="customerName" placeholder="👤 Grahak ka naam">
            <input type="number" id="amount" placeholder="₹ Kitne rupiye?">
            <input type="text" id="items" placeholder="🛍️ Samaan (ya Jama ki detail)">
            
            <!-- Do alag buttons: Udhar ke liye Lal, Jama ke liye Hara -->
            <div class="button-group">
                <button class="btn-udhar" onclick="addTransaction('udhar')">Udhar Likh Do</button>
                <button class="btn-jama" onclick="addTransaction('jama')">Paise Jama Karlo</button>
            </div>
        </div>

        <!-- Grahakon ki List -->
        <div id="accountList" class="list-section">
            <!-- JS yahan data bharegi -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
